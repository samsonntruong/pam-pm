<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pam{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">Pam</div>
    <div class="project-switcher">
      <label for="project-switcher">Project</label>
      <select id="project-switcher" name="project" onchange="switchProject(this.value)">
        {% for p in projects %}
        <option value="{{ p }}" {% if p == project %}selected{% endif %}>{{ p }}</option>
        {% endfor %}
      </select>
    </div>
  </header>
  <div class="layout">
    <aside class="sidenav">
      <nav>
        <a href="/setup" class="{% if active == 'setup' %}active{% endif %}">Setup</a>
        <a href="/rules" class="{% if active == 'rules' %}active{% endif %}">Rules</a>
        <a href="/board" class="{% if active == 'board' %}active{% endif %}">Board</a>
        <a href="/activity" class="{% if active == 'activity' %}active{% endif %}">Activity</a>
        <a href="/plan" class="{% if active == 'plan' %}active{% endif %}">Plan</a>
        <a href="/review" class="{% if active == 'review' %}active{% endif %}">Review</a>
      </nav>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
    function switchProject(value) {
      const url = new URL(window.location.href);
      url.searchParams.set("project", value);
      window.location.href = url.toString();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
